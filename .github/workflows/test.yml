name: Extension tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify VSIX
        run: |
          npm exec --yes --package=@vscode/vsce@3.7.1 -- npm run package:vsix
          node scripts/check-vsix.cjs artifacts/texpresso.vsix
